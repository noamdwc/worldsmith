[project]
name = "worldsmith"
version = "0.1.0"
description = "A small robotics experimentation harness"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40,<2",
    "mcp>=1.20,<2",
    "numpy>=2.4.6",
    "pymunk>=7.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
