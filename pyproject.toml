[project]
name = "worldsmith"
version = "0.1.0"
description = "A small robotics experimentation harness"
requires-python = ">=3.11"

[dependency-groups]
local = [
    "awscli==1.46.3",
    "boto3>=1.40,<2",
    "google-colab-cli==0.6.0",
    # Colab CLI needs both KernelClient and JupyterSubprotocol from this release.
    "jupyter-kernel-client==0.9.0",
    "mcp>=1.20,<2",
    { include-group = "simulation" },
]
simulation = [
    "numpy>=2.4.6",
    "pymunk>=7.3.1",
]
dev = [
    "pytest>=9.2.0",
    { include-group = "inference" },
]
inference = [
    "openai==1.99.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worldsmith*"]

[tool.setuptools.package-data]
"worldsmith.research_baseline" = ["JOURNAL.md"]

[tool.uv]
package = false
default-groups = ["local", "dev"]

[tool.uv.dependency-groups]
local = { requires-python = ">=3.12" }
